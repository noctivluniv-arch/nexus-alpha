[build]
  command = "cd artifacts/nexusalpha && pnpm install --no-frozen-lockfile && pnpm exec expo export --platform web --clear"
  publish = "artifacts/nexusalpha/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.30.3"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
