[build]
  command = """
    cd artifacts/nexusalpha && \
    pnpm install --no-frozen-lockfile && \
    pnpm exec expo export --platform web --clear && \
    mkdir -p dist/assets && \
    find ../../node_modules/.pnpm -name "Inter_*.ttf" -exec cp {} dist/assets/ \; && \
    find ../../node_modules/.pnpm -name "Feather.*.ttf" -exec cp {} dist/assets/ \; || \
    find ../../node_modules/.pnpm -name "Feather.ttf" -exec cp {} dist/assets/ \;
  """
  publish = "artifacts/nexusalpha/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.30.3"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
